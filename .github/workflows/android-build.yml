name: XCORE Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'xcore-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build XCORE APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: xcore-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Rebuild npm lockfile and install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: npx expo install --fix
        env:
          CI: true

      - name: Refresh lockfile after Expo alignment
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo-doctor@latest

      - name: Verify JavaScript bundle
        run: npx expo export --platform android --output-dir dist-test
        env:
          CI: true

      - name: Verify Android prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: true

      - name: Setup Expo
        run: npm install -g eas-cli

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
